name: Publish AlexaShop KROMBYTE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/static.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA-approved release
        uses: actions/checkout@v5
        with:
          ref: 04b4b19155b7fa02064e05effad8474e59c855ec
      - name: Verify and prepare public website
        run: |
          echo '763ffc46e4c3c75f8e8c4db21b121283a6a8feb673ee78d022b017c49e2197c4  alexashop-release.zip' | sha256sum --check
          unzip -q alexashop-release.zip -d _source
          node --test _source/tests/core.test.mjs
          python3 -c "import zipfile; z=zipfile.ZipFile('alexashop-release.zip'); z.extractall('_site', [n for n in z.namelist() if not n.startswith(('tests/', '.github/')) and n != 'README.md'])"
          test -f _site/condiciones.html
          test -f _site/favicon.ico
          test -f _site/assets/shop.mjs
          test "$(cat _site/CNAME)" = 'alexashop.cc'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to alexashop.cc
        id: deployment
        uses: actions/deploy-pages@v4
