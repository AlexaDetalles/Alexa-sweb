name: Publish AlexaShop KROMBYTE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/static.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified final release
        uses: actions/checkout@v4
        with:
          ref: 988714b86fd4a8163edc6486106f78c680b7f162
      - name: Verify and extract final website
        run: |
          echo "e52ea4d14d33171a2d358ceb7c11777d43c4a5d63f0b825749f7698843669abe  alexashop-release.zip" | sha256sum --check
          unzip -q alexashop-release.zip -d _site
          test -f _site/index.html
          test -f _site/assets/shop.mjs
          test "$(cat _site/CNAME)" = "alexashop.cc"
          node --test _site/tests/core.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to alexashop.cc
        id: deployment
        uses: actions/deploy-pages@v4
