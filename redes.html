<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3CVCB9D8V4"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexa Concierge | Redes</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --p-morado: rgb(157, 78, 221);
            --p-morado-light: #c77dff;
            --p-negro: #050505;
            --c-rojo-1: #29002a;
            --c-rojo-2: #6c006e;
            --c-rojo-3: #d400d8; 
            
            --glass: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --f-serif: 'Cormorant Garamond', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--p-negro);
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 60px 20px;
            position: relative;
        }

        /* --- FONDO AESTHETIC & GRID --- */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top center, #150a21 0%, var(--p-negro) 80%);
            z-index: -3;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
            mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
        }

        /* --- ORBES LUMINOSOS --- */
        .orb {
            position: fixed; width: 400px; height: 400px; border-radius: 50%;
            filter: blur(120px); z-index: -1; opacity: 0.15;
            animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-1 { background: var(--p-morado); top: -100px; left: -100px; }
        .orb-2 { background: #3c096c; bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* --- PUNTOS ROJOS PARPADEANTES --- */
        .red-dot {
            position: fixed; width: 3px; height: 3px; background-color: var(--c-rojo-3);
            border-radius: 50%; box-shadow: 0 0 10px 2px rgba(255, 26, 74, 0.8);
            z-index: 0; pointer-events: none; opacity: 0;
            animation: blinkDot infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* --- HEADER --- */
        .header {
            text-align: center; margin-bottom: 50px; z-index: 1;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-family: var(--f-serif); font-size: 3.8rem; letter-spacing: 12px;
            background: linear-gradient(180deg, #ffffff 0%, var(--p-morado-light) 100%);
            background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px; font-weight: 600; text-shadow: 0 10px 30px rgba(157, 78, 221, 0.2);
        }

        .header p {
            font-size: 0.7rem; letter-spacing: 8px; text-transform: uppercase;
            color: #aaa; font-weight: 400;
        }

        /* --- GRID DE ENLACES MEJORADO --- */
        .links-wrapper {
            width: 100%; max-width: 420px;
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px;
            perspective: 1000px; 
            z-index: 1;
        }

        .luxury-link {
            position: relative; background: linear-gradient(145deg, rgba(30,30,35,0.6) 0%, rgba(15,15,18,0.8) 100%);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px;
            padding: 22px 28px; text-decoration: none; color: white;
            display: flex; align-items: center; gap: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; opacity: 0; transform-style: preserve-3d;
            animation: fadeInUp 0.6s ease-out forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Línea lateral de acento aesthetic */
        .luxury-link::before {
            content: ''; position: absolute; left: 0; top: 0;
            width: 3px; height: 100%; background: var(--p-morado-light);
            box-shadow: 0 0 15px var(--p-morado-light);
            transform: scaleY(0); transition: transform 0.4s ease;
            transform-origin: bottom;
        }

        .luxury-link:hover {
            border-color: rgba(157, 78, 221, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(157, 78, 221, 0.05);
            transform: translateY(-5px);
        }

        .luxury-link:hover::before { transform: scaleY(1); }

        .icon-box {
            font-size: 1.6rem; color: rgba(255,255,255,0.7);
            display: flex; align-items: center; justify-content: center;
            transition: 0.4s; transform: translateZ(25px);
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.03); border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .luxury-link:hover .icon-box {
            color: var(--c-rojo-3); transform: translateZ(35px) scale(1.15);
            border-color: rgba(255, 26, 74, 0.3);
            box-shadow: 0 0 20px rgba(255, 26, 74, 0.2);
            background: rgba(255, 26, 74, 0.05);
        }

        .text-box { transform: translateZ(15px); }

        .text-box span {
            display: block; font-size: 0.95rem; letter-spacing: 2px;
            text-transform: uppercase; font-weight: 600; margin-bottom: 6px;
        }

        .text-box small {
            display: block; font-size: 0.65rem; color: #888;
            font-weight: 400; letter-spacing: 1px;
        }

        /* --- BOTÓN VOLVER --- */
        .back-home {
            margin-top: 60px; text-decoration: none; color: white;
            font-size: 0.65rem; letter-spacing: 4px; opacity: 0.4;
            text-transform: uppercase; padding: 10px 20px; transition: 0.4s;
            border-bottom: 1px solid transparent; z-index: 1;
        }

        .back-home:hover { opacity: 1; letter-spacing: 6px; border-bottom: 1px solid var(--c-rojo-3); color: var(--c-rojo-3); }

        /* --- ANIMACIÓN DE TRANSICIÓN (CÍRCULOS ROJOS) --- */
        .transition-circle {
            position: fixed;
            border-radius: 50%;
            width: 150vmax; height: 150vmax;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.8s cubic-bezier(0.64, 0.04, 0.35, 1);
        }

        .circle-1 { background-color: var(--c-rojo-1); transition-delay: 0s; }
        .circle-2 { background-color: var(--c-rojo-2); transition-delay: 0.15s; }
        .circle-3 { background-color: var(--c-rojo-3); transition-delay: 0.3s; }

        .transition-active { transform: translate(-50%, -50%) scale(1); }

        /* Keyframes */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="transition-circle circle-1" id="tc-1"></div>
    <div class="transition-circle circle-2" id="tc-2"></div>
    <div class="transition-circle circle-3" id="tc-3"></div>

    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div id="dots-container"></div> 

    <header class="header">
        <h1>ALEXA</h1>
        <p>Concierge Digital</p>
    </header>

    <main class="links-wrapper" id="links-container">
        <a href="https://menu.treinta.shop/tiendasalexa-e627a5" class="luxury-link transition-trigger" style="animation-delay: 0.1s;">
            <div class="icon-box"><i class="fas fa-shopping-bag"></i></div>
            <div class="text-box">
                <span>Catálogo Online</span>
                <small>Treinta | Compra Directa</small>
            </div>
        </a>

        <a href="https://wa.me/50497320939" class="luxury-link transition-trigger" style="animation-delay: 0.2s;">
            <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
            <div class="text-box">
                <span>Asistencia</span>
                <small>Atención Personalizada I</small>
            </div>
        </a>

        <a href="https://wa.me/50499226664" class="luxury-link transition-trigger" style="animation-delay: 0.3s;">
            <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
            <div class="text-box">
                <span>Asistencia</span>
                <small>Atención Personalizada II</small>
            </div>
        </a>

        <a href="https://www.instagram.com/tiendasalexa_/" class="luxury-link transition-trigger" style="animation-delay: 0.4s;">
            <div class="icon-box"><i class="fab fa-instagram"></i></div>
            <div class="text-box">
                <span>Instagram</span>
                <small>@tiendasalexa_</small>
            </div>
        </a>

        <a href="https://www.google.com/maps/place/Tiendas+alexa/@13.3294706,-87.1363722,17z/data=!3m1!4b1!4m6!3m5!1s0x8f703baa2d236681:0x6c99bf6f4906b58!8m2!3d13.3294706!4d-87.1337973!16s%2Fg%2F11yr86vvz4?entry=ttu&g_ep=EgoyMDI2MDIxOC4wIKXMDSoASAFQAw%3D%3D" class="luxury-link transition-trigger" style="animation-delay: 0.5s;">
            <div class="icon-box"><i class="fas fa-location-dot"></i></div>
            <div class="text-box">
                <span>Showroom</span>
                <small>Ubicación en Google Maps</small>
            </div>
        </a>
    </main>

    <a href="index.html" class="back-home transition-trigger">Cerrar Concierge</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Puntos Rojos Parpadeantes
            const dotsContainer = document.getElementById('dots-container');
            const numberOfDots = 18; 

            for(let i = 0; i < numberOfDots; i++) {
                const dot = document.createElement('div');
                dot.classList.add('red-dot');
                dot.style.left = `${Math.random() * 100}vw`;
                dot.style.top = `${Math.random() * 100}vh`;
                dot.style.animationDuration = `${Math.random() * 3 + 2}s`;
                dot.style.animationDelay = `${Math.random() * 5}s`;
                dotsContainer.appendChild(dot);
            }

            // 2. Efecto 3D en Tarjetas
            const cards = document.querySelectorAll('.luxury-link');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / 10) * -1;
                    const rotateY = (x - centerX) / 10;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });

            // 3. Transición de Círculos Rojos
            const triggers = document.querySelectorAll('.transition-trigger');
            const circles = [
                document.getElementById('tc-1'),
                document.getElementById('tc-2'),
                document.getElementById('tc-3')
            ];

            // FIX: Remover círculos si el usuario regresa a la página (back button)
            window.addEventListener('pageshow', (event) => {
                setTimeout(() => {
                    circles.forEach(circle => {
                        circle.classList.remove('transition-active');
                    });
                }, 2000); // Delay de 2 segundos para desaparecer
            });

            triggers.forEach(trigger => {
                trigger.addEventListener('click', (e) => {
                    e.preventDefault(); 
                    const targetUrl = trigger.href;
                    const clickX = e.clientX;
                    const clickY = e.clientY;

                    circles.forEach(circle => {
                        circle.style.left = `${clickX}px`;
                        circle.style.top = `${clickY}px`;
                        circle.classList.add('transition-active');
                    });

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1000);
                });
            });
        });
    </script>
</body>
</html>
